[package]
name = "boite"
version = "0.2.3"
description = "Lightweight multi-agent terminal multiplexer"
authors = ["mtsu"]
edition = "2021"

[lib]
name = "boite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
which = "7"
base64 = "0.22"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vte = "0.13"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
