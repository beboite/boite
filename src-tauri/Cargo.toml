[package]
name = "boite"
version = "1.0.3"
description = "Lightweight multi-agent terminal multiplexer"
authors = ["mtsu"]
edition = "2021"

[lib]
name = "boite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boite-core = { path = "../crates/boite-core" }
boite-agent-api = { path = "../crates/boite-agent-api" }
boite-identity = { path = "../crates/boite-identity" }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent-facing todo endpoint. Loopback only, and deliberately not the dev
# mcp-bridge: that one answers execute_js, this one answers three verbs on one
# table.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
rand = "0.10"
# A browser pane's address is a document the app is about to host in its own
# window, so it is parsed rather than prefix-matched: `http://evil.com@localhost`
# passes every `starts_with` check ever written.
url = "2"

# Constant-time comparison for the agent endpoint's bearer token. A byte-by-byte
# `!=` short-circuits, and this endpoint answers on loopback where anything
# running as the same user can call it in a loop.

# Resolves the app data directory before `tauri::Builder` exists, which is where
# the identifier migration has to run. Same crate and same rules Tauri uses for
# `app_data_dir()`, so the two agree on the path.
dirs = "6"

# Dev-only agent bridge. Optional so a release build links none of it: the
# plugin exposes execute_js and a screenshot command, and nothing gated by
# cfg(debug_assertions) alone keeps it out of the shipped binary.
tauri-plugin-mcp-bridge = { version = "0.12.0", optional = true }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

# Desktop only: a phone app is replaced by its store, never by itself, and the
# updater crate does not build for those targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The PTY read loop allocates a buffer per chunk on every terminal, all day.
# The Windows system allocator is the weakest of the three we ship on, and that
# path is exactly the small-short-lived-allocation pattern mimalloc is best at.
mimalloc = { version = "0.1", default-features = false }

# Paints the one row of a maximized borderless window that the client area is
# not given. Already in the tree through tauri, which takes it for the same HWND
# this hands back.
#
# **This version tracks tauri's, it is not ours to bump.** `win.hwnd()` returns
# the `HWND` of whatever `windows` tauri was built against, and that type is a
# different type in every release of the crate: ask for 0.62 while tauri is on
# 0.61 and the two coexist in the tree, every call here stops compiling with
# `expected HWND, found windows::Win32::Foundation::HWND`, and cargo is right.
# It is a Windows-only path, so ci on Linux says nothing about it and the break
# only surfaces in the release bundle. A dependabot bump belongs here the day
# tauri's own `windows` moves, not before.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# AppKit posts the only fullscreen signal that arrives when the transition
# *starts*; everything Tauri exposes reports it once the animation is over. All
# four crates are already in the tree through tauri/wry, so this pulls nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSDictionary", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication"] }
block2 = "0.6"
