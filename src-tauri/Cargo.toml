[package]
name = "boite"
version = "0.10.6"
description = "Lightweight multi-agent terminal multiplexer"
authors = ["mtsu"]
edition = "2021"

[lib]
name = "boite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boite-core = { path = "../crates/boite-core" }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-mcp-bridge = "0.12.0"

# AppKit posts the only fullscreen signal that arrives when the transition
# *starts*; everything Tauri exposes reports it once the animation is over. All
# four crates are already in the tree through tauri/wry, so this pulls nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSDictionary", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication"] }
block2 = "0.6"
