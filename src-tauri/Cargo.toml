[package]
name = "boite"
version = "0.10.6"
description = "Lightweight multi-agent terminal multiplexer"
authors = ["mtsu"]
edition = "2021"

[lib]
name = "boite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boite-core = { path = "../crates/boite-core" }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev-only agent bridge. Optional so a release build links none of it: the
# plugin exposes execute_js and a screenshot command, and nothing gated by
# cfg(debug_assertions) alone keeps it out of the shipped binary.
tauri-plugin-mcp-bridge = { version = "0.12.0", optional = true }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

# Desktop only: a phone app is replaced by its store, never by itself, and the
# updater crate does not build for those targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The PTY read loop allocates a buffer per chunk on every terminal, all day.
# The Windows system allocator is the weakest of the three we ship on, and that
# path is exactly the small-short-lived-allocation pattern mimalloc is best at.
mimalloc = { version = "0.1", default-features = false }

# AppKit posts the only fullscreen signal that arrives when the transition
# *starts*; everything Tauri exposes reports it once the animation is over. All
# four crates are already in the tree through tauri/wry, so this pulls nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSDictionary", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication"] }
block2 = "0.6"
