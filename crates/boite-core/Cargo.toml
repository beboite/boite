[package]
name = "boite-core"
version = "1.4.1"
description = "Portable core for boite: PTY orchestration, git, fs, session detection"
edition = "2021"

[lib]
name = "boite_core"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# Types only: the canonical events, the item shapes and the open spec the bus
# validates into. The runtime that owns the child processes stays on the hosts,
# so this dependency brings no executor with it.
boite-pilot = { path = "../boite-pilot" }
serde_json = "1"
toml = "1.1"
portable-pty = "0.9"
vte = "0.15"
which = "8"
dirs = "6"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
# The logging module. Every host writes through one `tracing` layer here, so the
# format, the redaction and the rotation are decided once rather than per binary.
# `env-filter` is what `BOITE_LOG` is written in; `registry` is what carries a
# span's fields down to the events inside it, which is the whole reason a thread
# id is named once per call rather than once per line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
# Parsing, not string matching: what a browser pane may frame is decided on a
# parsed URL, and both endpoints ask the same module (`browser`).
url = "2"
# SHA-256 for the event journal's hash chain, and SHA-384 in one test, which is
# the digest sqlx keys its migration ledger on. Also the digest an installed CLI
# is checked against, where its vendor publishes one (`cli_manager`).
sha2 = "0.11"

# Fetching the agent CLIs themselves (`cli_manager`). The blocking client, so
# this crate stays free of an async runtime of its own: an install runs on a
# thread and the panel reads snapshots. rustls with the bundled roots, which is
# the stack `tauri-plugin-updater` already brings, so a boite carries one TLS
# implementation rather than two.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
# The two archive formats every one of those vendors publishes. Not `.zst`, which
# two of them also publish and neither publishes only.
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# kill(pid, 0) to tell a live claude session from a registry entry left behind
# by one that died. Windows uses OpenProcess from windows-sys below.

# Benchmarks only. `default-features = false` drops plotters and rayon: the
# numbers are what this is for, and the HTML reports would pull a graphics stack
# into a CI job that compiles `--all-targets`.
[dev-dependencies]
criterion = { version = "0.8", default-features = false }
# The projection is proved against a real `boite_pilot::Runtime` driven by the
# scripted driver, which is async. Tests only: nothing in this crate's own code
# awaits anything.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "hot_paths"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    # A PTY's agent may be a grandchild (a launcher, a wrap shell), so session
    # ownership is decided on the process tree. ToolHelp is the pid-to-parent map.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
