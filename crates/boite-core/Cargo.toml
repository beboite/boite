[package]
name = "boite-core"
version = "0.8.2"
description = "Portable core for boite: PTY orchestration, git, fs, session detection"
edition = "2021"

[lib]
name = "boite_core"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vte = "0.13"
which = "7"
dirs = "6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
