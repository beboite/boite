[package]
name = "boite-agent-api"
version = "1.3.2"
description = "The HTTP door an agent uses to reach its own workspace, shared by the desktop and the server"
edition = "2021"

[lib]
name = "boite_agent_api"
doctest = false

[dependencies]
boite-core = { path = "../boite-core" }
boite-identity = { path = "../boite-identity" }
# The MCP engine and tool surface, shared with the stdio shim so the `/mcp`
# route and the sidecar binary cannot drift apart.
boite-mcp = { path = "../boite-mcp" }
axum = "0.8"
# `ServiceExt::oneshot`, for the `/mcp` route dispatching into this crate's own
# handlers in-process. Already in the tree through axum.
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Constant-time token comparison. A local process can call this endpoint in a
# loop, and a byte-by-byte `!=` short-circuits.
subtle = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# `spawn_blocking` for the git calls, which spawn processes that must not sit on
# the runtime, `time` for the routes that wait on a page, and `sync` for the
# oneshot a device's answer rides back on: both hosts already run a tokio
# runtime with a timer under axum.
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
# The page-question routes are async ends to end and the `/mcp` tests drive the
# async endpoint whole, so both carry a runtime of their own; the crate itself
# still borrows whichever host it runs in.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
