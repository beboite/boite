[package]
name = "boite-agent-api"
version = "1.0.6"
description = "The HTTP door an agent uses to reach its own workspace, shared by the desktop and the server"
edition = "2021"

[lib]
name = "boite_agent_api"
doctest = false

[dependencies]
boite-core = { path = "../boite-core" }
boite-identity = { path = "../boite-identity" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Constant-time token comparison. A local process can call this endpoint in a
# loop, and a byte-by-byte `!=` short-circuits.
subtle = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Only `spawn_blocking`: both hosts already run on a tokio runtime, and the git
# calls here spawn processes that must not sit on it.
tokio = { version = "1", features = ["rt"] }
