[package]
name = "boite-server"
version = "1.1.7"
description = "Headless boite server: PTY orchestration over WebSocket"
edition = "2021"

[[bin]]
name = "boite-server"
path = "src/main.rs"

[dependencies]
boite-core = { path = "../boite-core" }
boite-agent-api = { path = "../boite-agent-api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
subtle = "2"
rand = "0.10"
# Web Push (VAPID, RFC 8291). web-push-native is pure RustCrypto (aes-gcm +
# hkdf + p256), no OpenSSL/C bindings, so it cross-compiles to arm64 and builds
# on Windows. It hands back an http::Request we POST with the existing
# reqwest+rustls client. p256 generates/derives the VAPID keypair.
web-push-native = "0.5"
p256 = "0.13"
base64 = "0.23"
http = "1"
# Pure-Rust deflate (miniz_oxide backend, no C) so it cross-compiles to arm64.
# Used to gzip the one-shot scrollback replay frame.
flate2 = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# A pairing link nobody can type is a pairing flow nobody uses, so it is drawn:
# a QR in the terminal for a headless box, and a matrix on the wire for the
# devices screen. `default-features = false` drops `image` and `svg`, which
# would pull a graphics stack into a server binary; what is left has no
# dependencies at all.
qrcode = { version = "0.14", default-features = false }
