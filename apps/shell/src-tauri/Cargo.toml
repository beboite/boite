[package]
name = "boite-shell"
version = "2.0.0-alpha.1"
description = "Boite desktop shell: window, tray, and the local core"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "boite_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
