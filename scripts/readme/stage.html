<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Boite walkthrough</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#desktop{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#cursor{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transform:translate(-100px,-100px);transition:transform .45s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 2px 3px hsl(240 20% 0% / .45))}
#cursor svg{width:24px;height:30px}#pulse{position:fixed;z-index:99;width:44px;height:44px;border-radius:50%;border:2px solid hsl(254 87% 77%);pointer-events:none;opacity:0}
#pulse.pressed{animation:press .45s ease-out}@keyframes press{0%{opacity:.8;scale:.4}100%{opacity:0;scale:1.5}}
</style>
<iframe id="desktop" title="Boite desktop" src="/?fake=1&amp;open=recent&amp;team=1"></iframe>
<div id="pulse"></div><div id="cursor"><svg viewBox="0 0 24 30"><path d="M3 2v23l6-6 5 9 4-2-5-9h9z" fill="white" stroke="hsl(240 10% 12%)" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</html>
