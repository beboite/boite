<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#101013" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <!-- Geist only: the first screen draws no mono text, and on a slow link Geist Mono's
         70 KB would compete with the entry chunk. The service worker caches both. -->
    <link rel="preload" href="./fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Boite</title>
    <!-- Painted before the stylesheet arrives, so a reload never flashes the wrong ground. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101013;
        color: #ececf1;
        overflow: hidden;
      }

      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f3f3f6;
        color: #1c1c21;
      }

      /* Grain paints its fade from the stylesheet; the mid tone stands in until then. */
      html[data-theme='grain'],
      html[data-theme='grain'] body {
        background: #2a2a31;
        color: #ececf1;
      }
    </style>
    <!-- The same rule as lib/theme.ts, run before the first paint: dark stamps nothing. -->
    <script>
      if (new URLSearchParams(location.search).get('view') === 'quotas') document.documentElement.dataset.view = 'quotas';
      try {
        var accent = localStorage.getItem('boite.accent-hue');
        if (accent !== null && Number.isFinite(Number(accent)) && Number(accent) >= 0 && Number(accent) <= 360) document.documentElement.style.setProperty('--accent-hue', accent);
        var stored = localStorage.getItem('boite.theme');
        var theme = stored === 'dark' || stored === 'light' || stored === 'grain' ? stored : 'system';
        // Grain rides behind an experiment: a stored choice with the switch off is System again.
        if (theme === 'grain') {
          var on = false;
          try {
            var raw = localStorage.getItem('boite.experiments');
            on = raw !== null && JSON.parse(raw).indexOf('theme-grain') !== -1;
          } catch (e) {}
          if (!on) theme = 'system';
        }
        if (theme === 'grain') {
          document.documentElement.dataset.theme = 'grain';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1a1e');
        } else {
          var light =
            theme === 'light' ||
            (theme === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f3f6');
          }
        }
      } catch (e) {}
    </script>
    <!-- A browser under the floor (Safari 15.4, Chrome 111: docs/phone.md) fails to
         parse the app and never runs main.ts, which sets the flag first. It says so
         instead of staying blank. Two literal sentences: the catalogues never loaded. -->
    <script>
      window.addEventListener('load', function () {
        var app = document.getElementById('app');
        if (window.__boiteBooted || !app || app.childElementCount > 0) return;
        var note = document.createElement('p');
        note.setAttribute('role', 'alert');
        note.style.cssText = 'margin:0;padding:32px 24px;max-width:520px;font:15px/1.5 system-ui,-apple-system,sans-serif';
        note.textContent = /^fr\b/i.test(navigator.language || '')
          ? 'Boite ne peut pas démarrer dans ce navigateur. Il faut Safari 15.4 (iOS 15.4) ou Chrome 111, ou une version plus récente.'
          : 'Boite cannot start in this browser. It needs Safari 15.4 (iOS 15.4) or Chrome 111, or a newer version.';
        app.appendChild(note);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
