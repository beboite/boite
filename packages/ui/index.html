<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101013" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="preload" href="./fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Boite</title>
    <!-- Painted before the stylesheet arrives, so a reload never flashes the wrong ground. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101013;
        color: #ececf1;
        overflow: hidden;
      }

      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f3f3f6;
        color: #1c1c21;
      }
    </style>
    <!-- The same rule as lib/theme.ts, run before the first paint: dark stamps nothing. -->
    <script>
      try {
        var stored = localStorage.getItem('boite.theme');
        var theme = stored === 'dark' || stored === 'light' ? stored : 'system';
        var light =
          theme === 'light' ||
          (theme === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f3f6');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
