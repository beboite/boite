version: 2
# The workflow actions, the agent CLIs and the shell's Cargo dependencies share
# one weekly pull request, majors included as before, so a week of their updates
# costs one CI run instead of three.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
updates:
  - package-ecosystem: github-actions
    # The composite actions pin their own actions; `/` alone skips them.
    directories: ['/', '/.github/actions/*']
    multi-ecosystem-group: weekly
    patterns: ['*']
  - package-ecosystem: npm
    directory: /docker/agents
    multi-ecosystem-group: weekly
    patterns: ['*']
  - package-ecosystem: cargo
    directory: /apps/shell/src-tauri
    multi-ecosystem-group: weekly
    patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svelte-check's --tsgo needs TypeScript 6 beside @typescript/native 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Majors arrive one pull request each, so a breaking SDK stays isolated.
      workspace:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Move to a new Node major after it enters LTS; keep digest updates enabled.
      - dependency-name: node
        update-types: [version-update:semver-major]
