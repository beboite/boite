version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors arrive one pull request each, so a breaking SDK stays isolated.
      workspace:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docker/agents
    schedule:
      interval: weekly
    groups:
      agent-clis:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /apps/shell/src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
