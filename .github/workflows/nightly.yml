name: boite (de nuit)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      announcement:
        description: Optional announcement above the automatic changelog.
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: boite-de-nuit
  cancel-in-progress: false

jobs:
  revision:
    # Enabled by default; false is the emergency stop for both entry points.
    if: vars.NIGHTLY_ENABLED != 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
      reserved: ${{ steps.revision.outputs.reserved }}
      tag: ${{ steps.revision.outputs.tag }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > released.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" > tags.json
          bun scripts/ci/nightly.ts released.json tags.json

  verify:
    needs: revision
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    with:
      skip-server: true
      skip-android: true
      sign-updates: true
      channel: nightly
      version: ${{ needs.revision.outputs.version }}
    permissions:
      contents: read
      packages: write

  # The tag is taken once the checks pass: the release tags ruleset keeps a tag
  # from being deleted, so one taken before them outlived every failed build.
  reserve:
    needs: [revision, verify, image, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reserve version for this commit
        # A step, not the job, is skipped: a skipped job would skip every job after it.
        if: needs.revision.outputs.reserved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

  # Signed, or the previous release's APK taken back when apps/android, the
  # host and the key are unchanged since it was built (docs/android.md).
  android:
    needs: revision
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    with:
      release: true
      version: ${{ needs.revision.outputs.version }}

  image:
    needs: revision
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/server.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
      defer-manifest: true
      channel: dev
      version: ${{ needs.revision.outputs.version }}

  publish-image:
    needs: [revision, reserve, image]
    uses: ./.github/workflows/server-manifest.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: |
        nightly
        ${{ needs.revision.outputs.tag }}
        sha-${{ github.sha }}

  release:
    needs: [revision, verify, publish-image, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installer
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: desktop-bundle-*
          merge-multiple: true
          path: artifacts
      # Beside the desktop files, which updater-manifest.ts checks one by one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-apk
          path: android
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          RELEASE_ANNOUNCEMENT: ${{ inputs.announcement }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > released.json
          bun scripts/ci/changelog.ts released.json artifacts/release-notes.md
          bun scripts/ci/updater-manifest.ts artifacts
          existing=$(jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' released.json)
          cd artifacts
          # updater-manifest.ts refused any file outside this set.
          installers=(./*.exe ./*.deb ./*.AppImage ./*.dmg ./*.app.tar.gz)
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          apks=(../android/boite-*.apk)
          test "${#apks[@]}" -eq 1 && test -f "${apks[0]}"
          (cd ../android && sha256sum ./boite-*.apk) >> SHA256SUMS.txt
          if [[ -n "$existing" ]]; then
            echo "$existing" | jq -e '.draft == true' >/dev/null
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            else
              test "$(echo "$existing" | jq -r .target_commitish)" = "$GITHUB_SHA"
            fi
            gh release upload "$RELEASE_TAG" "${installers[@]}" "${apks[@]}" ./*.sig latest.json SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" "${installers[@]}" "${apks[@]}" ./*.sig latest.json SHA256SUMS.txt --target "$GITHUB_SHA" --title "boite (de nuit) $RELEASE_TAG" --prerelease --latest=false --notes-file release-notes.md
          fi
