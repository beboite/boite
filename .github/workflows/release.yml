name: release

# Push a tag matching the version in tauri.conf.json (v0.10.7) and this builds
# every platform, signs the updater payloads and opens a draft release. The
# release stays a draft until you publish it: `releases/latest` only starts
# answering — and clients only start updating — once you do.
#
# Actions are pinned by commit SHA rather than by tag. This workflow is the only
# place the signing key is ever decrypted, and a movable tag would let an
# upstream repo change what runs next to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The preflight job below reads this repository's workflow runs.
  actions: read

jobs:
  # Runs first and alone: the version lives in one manifest per crate plus the
  # two JSON files, and a release built from a mismatched set is worse than no
  # release at all. Catching it here also avoids paying for four platform
  # runners before the mistake surfaces.
  #
  # The Cargo manifests are discovered rather than listed. They were listed
  # once, and `boite-identity` and `boite-agent-api` were added to the workspace
  # without being added here, so two crates could ship a version nobody checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree with each other, and with the tag
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)

          echo "tauri.conf.json=$conf package.json=$pkg"

          if [ "$pkg" != "$conf" ]; then
            echo "::error::version mismatch: tauri.conf.json says $conf, package.json says $pkg" >&2
            exit 1
          fi

          for manifest in src-tauri/Cargo.toml crates/*/Cargo.toml; do
            v=$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)
            echo "$manifest=$v"
            if [ "$v" != "$conf" ]; then
              echo "::error::version mismatch: tauri.conf.json says $conf, $manifest says $v" >&2
              exit 1
            fi
          done

          # workflow_dispatch has no tag to check against; tauri-action will
          # derive one from the config either way.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$conf" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $conf" >&2
              exit 1
            fi
          fi

      - name: Signing key is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset — the bundles would ship without signatures and no client could apply them" >&2
            exit 1
          fi

  # Has ci already gone green on this exact commit?
  #
  # It usually has. The release doc says to bump the version, commit, then tag
  # that commit and push, so the same tree goes through ci on the master push
  # and again here: six jobs, two of them platform runners, rerun on a tree
  # already proven byte for byte. The tag carries no result of its own, hence
  # the probe rather than an assumption either way.
  #
  # A run is only accepted if it succeeded on this sha. Anything else, no run
  # at all, a failure, a tag pushed on a commit that never touched a branch,
  # leaves this empty and the suite below runs.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.probe.outputs.state }}
    steps:
      - name: Look for a green ci on this sha
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"
          green='[.workflow_runs[] | select(.conclusion == "success")] | length'
          count=$(gh api "$runs" -q "$green")
          if [ "${count:-0}" -gt 0 ]; then
            echo "ci already passed on $GITHUB_SHA, skipping the rerun"
            echo "state=green" >> "$GITHUB_OUTPUT"
          else
            echo "no green ci on $GITHUB_SHA, running it"
            echo "state=missing" >> "$GITHUB_OUTPUT"
          fi

  # The whole ci suite, on the tagged tree. A tag is pushed on the same commit
  # as the version bump, and ci only listens to branches, so nothing here used
  # to prove that what gets signed compiles, lints or passes a test. Reusing
  # ci.yml rather than restating it keeps one definition of "green".
  #
  # Skipped when preflight found that same proof already on this sha. Nothing
  # below is allowed to read a skip as a pass by accident: bundle spells both
  # outcomes out.
  tests:
    needs: preflight
    if: needs.preflight.outputs.ci != 'green'
    uses: ./.github/workflows/ci.yml

  bundle:
    needs: [verify, preflight, tests]
    # `needs` alone would drop this job the moment tests is skipped, and a
    # release that quietly builds nothing is the worst of the three outcomes.
    # Skipped is a pass here, and only here, because preflight is what put it
    # in that state.
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Oldest runner still carrying webkit2gtk-4.1: the glibc it links
          # against is the floor for every Linux user we can serve.
          - platform: ubuntu-22.04
            target: ""
            args: ""
          # NSIS only. The MSI installs per-machine, which would put a UAC
          # prompt in front of every silent update.
          - platform: windows-latest
            target: ""
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # Root `target/` and root `Cargo.lock`. This is one cargo workspace: there
      # is no src-tauri/target to save and no src-tauri/Cargo.lock to hash, so
      # the key was the hash of a file that does not exist and the path held
      # nothing. Four platform runners recompiled from zero on every release
      # while a cache step reported success. ci.yml already carried the same
      # correction, with the comment explaining it, and this half never got it.
      #
      # restore-keys too: the key changes on any dependency bump, and a release
      # tag usually follows one, which is exactly when a from-scratch build of
      # the whole tree costs the most.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.platform }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.target }}-cargo-

      - name: System deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Same global install cache as ci.yml: setup-bun caches the binary, not
      # the packages, and this install runs once per platform runner.
      - name: Cache bun deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.platform }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ matrix.platform }}-bun-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The sidecar file name must carry the triple being built for, and the
          # macOS jobs cross-compile. Empty on Linux/Windows, where the script
          # falls back to the host triple.
          BOITE_TARGET: ${{ matrix.target }}
          # Without these the build still succeeds but emits no .sig, and
          # latest.json comes out unusable. They are the updater's whole trust
          # anchor — never echo them, never move them out of repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into the binary (`option_env!`). Empty or unset falls back
          # to https://telemetry.invalid, so a tag without this secret ships a
          # fleet that cannot report. Never echo it.
          BOITE_TELEMETRY_URL: ${{ secrets.BOITE_TELEMETRY_URL }}
        with:
          tagName: v__VERSION__
          releaseName: Boite v__VERSION__
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The bundler writes a `.sig` beside every updater payload and tauri-action
  # uploads all of them, but nothing ever reads one: `latest.json` carries the
  # same signature inline and is the only file the updater fetches. Six assets
  # nobody downloads is most of the release page, so they go once every platform
  # has finished uploading. Deleting them cannot break an update; deleting a
  # payload would, hence the suffix match rather than a count.
  prune:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drop the signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no tag, and tauri-action names the release
          # from the config in that case too.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi

          mapfile -t sigs < <(gh release view "$tag" --json assets -q '.assets[].name' | grep '\.sig$' || true)
          if [ "${#sigs[@]}" -eq 0 ]; then
            echo "no .sig assets on $tag"
            exit 0
          fi

          for name in "${sigs[@]}"; do
            gh release delete-asset "$tag" "$name" --yes
            echo "deleted $name"
          done

  # The Android wrapper, signed. ci builds it unsigned on every push to prove
  # it compiles; this is the copy a phone installs, and it goes on the release
  # page next to the desktop bundles.
  #
  # After bundle rather than beside it: tauri-action opens the draft release,
  # and two jobs creating one for the same tag at the same moment would open
  # two. Three minutes of gradle after the slowest platform is the price.
  #
  # The keystore rides in as base64 in ANDROID_KEYSTORE, with its password in
  # ANDROID_KEYSTORE_PASSWORD (ANDROID_KEY_PASSWORD when the key's own differs).
  # No keystore means an unsigned APK on the page, said out loud as a warning:
  # a release is not held back for the one asset that has a manual fallback.
  #
  # What is checked and not just done: the certificate the APK carries has to
  # be the fingerprint in mobile/assetlinks.json. A TWA whose signature does
  # not match what the server publishes opens in a Custom Tab with a URL bar,
  # silently, on every phone, and nothing but this comparison would notice a
  # release signed with the wrong keystore.
  #
  # Most releases leave mobile/ alone, and the wrapper is a shell whose whole
  # UI comes from the server, so a rebuild from unchanged sources produces the
  # same bits — except versionName and versionCode, which gradle bakes in from
  # package.json. Those releases reuse the previous release's APK instead of
  # rebuilding, under its original name: boite-1.3.1.apk on the v1.3.3 page is
  # an APK truthfully naming the tag it was built from, where a renamed copy
  # would claim a version it does not carry. Only a published release with a
  # *signed* APK is reused; a history of unsigned ones builds again, since the
  # keystore may have arrived since.
  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reuse probe below diffs mobile/ against the previous release's
          # tag, which a depth-1 checkout does not carry.
          fetch-depth: 0

      # Decides between the two paths and, on reuse, already places the file
      # where the upload step reads. Drafts are skipped: the draft this very
      # run is filling is first on the list.
      - name: Reuse the previous APK when mobile/ is untouched
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/apk"
          state=build

          found=$(gh release list --limit 20 --json tagName,isDraft \
            -q '.[] | select(.isDraft | not) | .tagName' | while read -r t; do
              n=$(gh release view "$t" --json assets \
                -q '.assets[].name' | grep -E '^boite-[0-9]+\.[0-9]+\.[0-9]+\.apk$' | head -1 || true)
              if [ -n "$n" ]; then
                echo "$t $n"
                break
              fi
            done)

          tag=${found% *}
          name=${found#* }
          if [ -n "$tag" ] \
            && git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            && git diff --quiet "$tag" HEAD -- mobile/; then
            gh release download "$tag" --pattern "$name" --dir "${{ runner.temp }}/apk"
            echo "mobile/ untouched since $tag, reusing $name"
            state=reuse
          elif [ -n "$tag" ]; then
            echo "mobile/ changed since $tag (or its git tag is gone), building"
          else
            echo "no published release carries a signed APK yet, building"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.probe.outputs.state == 'build'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: steps.probe.outputs.state == 'build'

      - name: Build the APK
        if: steps.probe.outputs.state == 'build'
        working-directory: mobile
        run: ./gradlew assembleRelease

      - name: Sign it
        if: steps.probe.outputs.state == 'build'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          alias=$(jq -r .signingKey.alias mobile/twa-manifest.json)
          src=mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$src"
          out="${{ runner.temp }}/apk"
          mkdir -p "$out"

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE is unset: the release carries an unsigned APK, which no phone installs as is"
            cp "$src" "$out/boite-$version-unsigned.apk"
            exit 0
          fi

          # The build-tools AGP just pulled for this compileSdk, newest wins.
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="${{ runner.temp }}/android.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"

          # apksigner wants an aligned input and reads the passwords from the
          # environment, so neither one lands in a process list.
          "$bt/zipalign" -f -p 4 "$src" "$out/aligned.apk"
          "$bt/apksigner" sign \
            --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$alias" --key-pass env:KEY_PASSWORD \
            --out "$out/boite-$version.apk" "$out/aligned.apk"
          rm -f "$out/aligned.apk" "$ks"

          # `Signer #1 certificate SHA-256 digest:` on build-tools 35, `V3.0
          # Signer: certificate SHA-256 digest:` on 37, so the prefix is not
          # anchored. The first scheme printed is the one every Android reads.
          got=$("$bt/apksigner" verify --print-certs "$out/boite-$version.apk" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr -d ': \r' | tr 'A-F' 'a-f')
          want=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' mobile/assetlinks.json | tr -d ':' | tr 'A-F' 'a-f')
          echo "signed with $got"
          if [ "$got" != "$want" ]; then
            echo "::error::the APK is signed with $got but mobile/assetlinks.json publishes $want: the TWA would open with a URL bar on every phone" >&2
            exit 1
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          gh release upload "$tag" "${{ runner.temp }}"/apk/*.apk --clobber
