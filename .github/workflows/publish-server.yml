name: publish server

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-server
  cancel-in-progress: false

jobs:
  verified:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-nightly.')
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/ci/release-version.ts
      - name: Require a tested, published release on this commit
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length > 0' | grep -qx true
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
          # Only GitHub's current stable release may move latest. Publishing an
          # older release later must not silently roll every server back.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          {
            echo 'tags<<EOF'
            echo "$RELEASE_TAG"
            echo "sha-$GITHUB_SHA"
            [[ "$latest" != "$RELEASE_TAG" ]] || echo latest
            echo EOF
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: verified
    uses: ./.github/workflows/server.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
      tags: ${{ needs.verified.outputs.tags }}
