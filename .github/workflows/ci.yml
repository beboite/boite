name: ci

on:
  push:
    branches: [main]
  # A draft runs the Linux checks; ready_for_review starts the full run, and
  # converted_to_draft cancels one in progress and fails its planning (changes job).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Required only when sign-updates is enabled.
        required: false
      # A published macOS build is signed with this Developer ID and notarized
      # when all six are set; without them it stays ad-hoc signed.
      APPLE_CERTIFICATE:
        description: Base64 of the Developer ID Application .p12.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Developer ID Application: <name> (<team id>).'
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID, for notarization.
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        description: Contents of the AuthKey_<id>.p8 file.
        required: false
    inputs:
      force:
        type: boolean
        default: true
      skip-server:
        type: boolean
        default: false
      sign-updates:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A main run finishes: merges land faster than a run takes, so cancelling
  # left main without a green commit to publish (docs/ci.md#run-modes-and-platforms).
  # A newer push only replaces the pending one.
  cancel-in-progress: ${{ github.workflow == 'ci' && github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    # A draft run reports its planning and reusable workflows as "(draft)",
    # and fails its other jobs when rerun once the pull request is ready, so a
    # draft never passes a required name (docs/ci.md#draft-pull-requests).
    name: ${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && 'Plan and repository checks (draft)' || 'Plan and repository checks' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # A main push compares with the last main commit whose CI passed (changes.ts).
      actions: read
      # A draft run reads whether its pull request is still a draft.
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shellRust: ${{ steps.filter.outputs.shellRust }}
      server: ${{ steps.filter.outputs.server == 'true' && !inputs.skip-server }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      e2eTypes: ${{ steps.filter.outputs.e2eTypes }}
      stress: ${{ steps.filter.outputs.stress }}
      portable: ${{ steps.filter.outputs.portable }}
      coreRunners: ${{ steps.filter.outputs.coreRunners }}
      stale: ${{ steps.stale.outputs.stale == 'true' }}
    steps:
      # The conversion cancels a full run, whose planning may have passed
      # under the required name: failing it keeps that success from merging
      # next to the draft's skips. The next push runs the draft checks.
      - name: Stop on a conversion to draft
        if: github.event.action == 'converted_to_draft'
        run: |
          echo "::error::converted to draft: the next push runs the draft checks, gh pr ready the full run"
          exit 1
      # A rerun keeps its event: an old draft run rerun once the pull request
      # is ready would put skips back under the required names. Its direct jobs
      # then run only to fail; an unreadable flag counts as ready.
      - id: stale
        if: github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .draft) || draft=unreadable
          if [ "$draft" != true ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::error::pull request #$NUMBER is no longer a draft (draft: $draft): this draft run fails its checks; rerun the latest ready run instead"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: bun scripts/ci/changes.ts
      - run: bun install --frozen-lockfile
      - name: Audit frozen dependencies
        run: bun audit
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci scripts/migrate ./bench ./apps/shell/scripts
      # Missing sentences are warnings here and in the nightly; release.yml refuses them.
      - run: bun scripts/ci/translations.ts
      - run: bun run check:architecture
      - run: bun test scripts/architecture
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # The ruleset requires each check name a pull request reports
  # (docs/ci.md#check-names). Outside every needs chain: a gap fails this job
  # on main, so the run stays red and the nightly waits, while the tests still
  # run and a rerun of this job alone clears it. Pull requests skip it:
  # required-checks.test.ts already fails on a renamed job.
  ruleset:
    name: Ruleset check names
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/required-checks.ts --live

  # One job per runner of CORE_ALL in changes.ts, not a matrix: a skipped job
  # then reports its own fixed name (docs/ci.md#check-names). Each runs when
  # coreRunners lists its label; the quotes keep `ubuntu-24.04` from matching
  # `ubuntu-24.04-arm`. Pull requests leave out the Intel Mac.
  core-linux-x64:
    name: Core tests (Linux x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04"')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: &core-steps
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Core data directories, worktrees and Chrome profiles go to the runner's
      # temp drive (D: on Windows), as in the E2E shards (docs/ci.md#build-cost).
      - run: bun run --cwd packages/core test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  core-linux-arm64:
    name: Core tests (Linux arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04-arm"')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps: *core-steps

  core-windows-x64:
    name: Core tests (Windows x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"windows-2025"')) }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps: *core-steps

  core-macos-arm64:
    name: Core tests (macOS arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15"')) }}
    runs-on: macos-15
    timeout-minutes: 15
    steps: *core-steps

  core-macos-x64:
    name: Core tests (macOS x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15-intel"')) }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps: *core-steps

  web:
    name: Type checks and UI tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Caches are saved on main only: a pull request's copy is visible to that
      # pull request alone and would evict the ones every pull request restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-
      - run: bun run check
      - run: bun run --cwd packages/ui test --maxWorkers=8
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}

  telemetry:
    name: Telemetry relay tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.telemetry == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test packages/core/test/telemetry.test.ts

  e2e-types:
    name: E2E type check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.e2eTypes == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:e2e

  # The UI the E2E shards and stress test, built once. Vite emits the same
  # chunks on Linux and Windows except for a CSS color rounded in its sixth
  # decimal and the gzip OS byte (docs/ci.md#e2e-preparation).
  ui:
    name: Build UI
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.stress == 'true' || (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - name: Build the fake-client E2E bundle
        run: bun tests/e2e/lib/warm.ts --build-only tests/e2e/.artifacts/fake-ui
      # The production UI keeps its dot folder: .well-known/assetlinks.json.
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-dist
          path: packages/ui/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  stress:
    name: Stress fixtures
    needs: [changes, ui]
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.stress == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_STRESS_ARTIFACTS: tests/e2e/.artifacts/stress
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      # Fixed protocol, unhealthy-core and echo fixtures use temporary data only.
      # Preserve all three distinct scenarios and their existing deadlines.
      - run: bun run test:stress
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: stress-fixture-evidence
          path: tests/e2e/.artifacts/stress/
          retention-days: 7

  # A pull request's sizes, measured on Linux against its base's, which
  # bundle-size.yml keeps for every main commit, and against the last
  # published build plus 2 % (docs/ci.md#bundle-growth). Rerun this job alone
  # after editing the body.
  size:
    name: Bundle size
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The base's and the published build's artifacts from main's runs.
      actions: read
      # The pull request body, read at run time so a rerun sees an edit.
      pull-requests: read
    steps:
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - run: bun run build:core
      - name: Measure
        run: bun scripts/ci/budgets.ts measure .artifacts/bundle-sizes/bundle-sizes.json
      - name: Compare with the base and the ceiling
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/ci/budgets.ts check .artifacts/bundle-sizes/bundle-sizes.json

  # The callers of reusable workflows always run and pass `enabled`: a skipped
  # caller reports one check named after itself, a running one each inner
  # job's name, skipped or not (docs/ci.md#check-names).
  desktop:
    name: ${{ github.event.pull_request.draft && 'Desktop (draft)' || 'Desktop' }}
    needs: changes
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      APPLE_CERTIFICATE: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign-updates && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ inputs.sign-updates && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ inputs.sign-updates && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.APPLE_API_PRIVATE_KEY || '' }}
    with:
      enabled: ${{ needs.changes.outputs.desktop == 'true' }}
      platforms: ${{ needs.changes.outputs.portable }}
      # Only apps/shell, two embedded page scripts and shared inputs reach them (changes.ts).
      rust-tests: ${{ needs.changes.outputs.shellRust == 'true' }}
      sign-updates: ${{ inputs.sign-updates == true }}
      native-e2e: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read

  # Three shards written out, not a matrix, for the same fixed names as the
  # core jobs. E2E_SHARD picks the shard's files.
  e2e-1:
    name: E2E 1/3
    needs: [changes, ui]
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 1
    steps: &e2e-steps
      # A stale draft run fails here rather than skip (changes job).
      - name: Stop a stale draft run
        if: needs.changes.outputs.stale == 'true'
        run: |
          echo "::error::this draft run was rerun after the pull request went ready; rerun the latest ready run instead"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui
      # Chrome profiles and core data directories go to the runner's temp
      # drive (D:). On C:, Chrome stalled page loads for 15 to 60 s while the
      # UI server had answered: 8 stalls in 5 of 9 shard runs against 0 in 9,
      # and 706 s of tests against 420 s (PR #513, 2026-10-15).
      - name: Prepare end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun tests/e2e/lib/warm.ts --prebuilt $env:BOITE_E2E_FAKE_UI
      # Each runner has its own Vite cache. Files stay sequential within a shard.
      # The native shell file runs against the installer in the desktop job.
      # Shards are cut on recorded seconds per file (scripts/ci/e2e-shards.ts).
      - name: Browser and core end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $files = @(bun scripts/ci/e2e-shards.ts $env:E2E_SHARD 3)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'No browser or core E2E files for this shard' }
          # A quarantined test that fails runs once more (scripts/ci/quarantine.json).
          bun scripts/ci/flaky.ts @files
      - uses: ./.github/actions/upload-artifact
        if: failure() || cancelled()
        with:
          name: e2e-${{ env.E2E_SHARD }}-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  e2e-2:
    name: E2E 2/3
    needs: [changes, ui]
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 2
    steps: *e2e-steps

  e2e-3:
    name: E2E 3/3
    needs: [changes, ui]
    if: ${{ !cancelled() && needs.changes.outputs.stale == 'true' || success() && (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 3
    steps: *e2e-steps

  server:
    name: ${{ github.event.pull_request.draft && 'Server (draft)' || 'Server' }}
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/server-verify.yml
    with:
      enabled: ${{ needs.changes.outputs.server == 'true' }}

  android:
    name: ${{ github.event.pull_request.draft && 'Android (draft)' || 'Android' }}
    needs: changes
    uses: ./.github/workflows/android.yml
    with:
      enabled: ${{ needs.changes.outputs.android == 'true' }}
