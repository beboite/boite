name: ci

on:
  push:
    branches: [master, main]
  # Every pull request, whatever it targets. This used to be filtered to
  # `[master, main]` like the push trigger above, and the two are not the same
  # question: a branch stacked on another branch opens a PR whose base is not
  # master, no job runs, and GitHub reports it MERGEABLE and CLEAN because
  # nothing failed. Zero checks reads as a pass on the page somebody merges
  # from. That is the same shape as the blocker this whole repair started with,
  # where publication waited on a `ci` it never asked for.
  pull_request:
  # release.yml calls this before it builds anything: a tag push does not
  # trigger the branch events above, so without the call a release was signed
  # and published without a single test having run on that tree.
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # This job, the two below it and the four release runners all run
      # `bun install --frozen-lockfile`, and setup-bun caches the bun binary,
      # never the packages. This is the global install cache, keyed on the
      # lockfile, so an unchanged tree resolves from disk.
      - name: Cache bun deps
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Sync + svelte-check + oxlint
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build (vite only)
        run: bun run build
      # What the window downloads before it can paint, against a committed
      # ceiling. Boite's two bundle optimisations — the lazily imported PDF
      # worker and the split route chunks — had no number attached to them and
      # nothing that would notice the day one stopped working.
      - name: Bundle budget
        run: bun run budget

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      # Cargo workspace: the build dir is the repo-root target/, and the only
      # lockfile is the root one. Keying on src-tauri/Cargo.lock cached nothing
      # and left crates/ out of every job below.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # The tauri build script resolves externalBin before compiling anything,
      # and a missing sidecar fails the whole crate rather than degrading. The
      # release bundle builds it through scripts/build-sidecar.mjs; a check job
      # only needs the file to exist under the right name, so the debug build
      # is enough and costs a fraction of the release one.
      - name: Sidecar placeholder
        run: |
          cargo build -p boite-mcp
          mkdir -p src-tauri/binaries
          cp target/debug/boite-mcp \
            "src-tauri/binaries/boite-mcp-$(rustc -vV | sed -n 's/^host: //p')"
      # No `cargo check` step ahead of this one. It was there, with the same
      # `--workspace --all-targets`, and it bought nothing: clippy runs through
      # `clippy-driver`, which fingerprints differently from rustc, so it never
      # reused a single unit of what check had just built. It type-checked the
      # whole workspace a second time and reported the same errors plus the
      # lints. One pass, and it is this one.
      #
      # `--all-targets` covers `crates/boite-core/benches/hot_paths.rs` too, so
      # a bench that stopped compiling fails here rather than the day somebody
      # wants a number. There used to be a `cargo bench --workspace --no-run`
      # below for that, justified by benches building "only under the default
      # features". They build under the same ones: `criterion` is a plain
      # dev-dependency with `default-features = false` pinned in the manifest,
      # not something a feature flag turns on. Running the benchmarks is a
      # local job either way: on a shared runner the numbers measure the runner.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # What the two lockfiles are known to be vulnerable to.
  #
  # dependabot already opens the version bumps, and version drift is not the
  # question this asks: a dependency can be current and still be the one with
  # the advisory against it, and nothing here has ever looked. For an app that
  # signs its own binaries and ships a server that listens, "nobody checked" is
  # not a posture.
  #
  # It gates, and that is deliberate even though an advisory filed against a
  # transitive crate turns an unrelated pull request red. Release calls this
  # workflow before it builds anything, so a gate here is the difference between
  # knowing before the tag and knowing after the binary is signed. The fix for a
  # red one is the bump dependabot is already offering.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun deps
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      # Moderate and up. The one advisory below that line today is a `cookie`
      # transitive of @sveltejs/kit with no fixed version published, and a gate
      # that is red for something nobody can act on is a gate people learn to
      # ignore. Raising the floor is a decision to make out loud rather than by
      # adding an ignore entry per advisory.
      - name: bun audit
        run: bun audit --audit-level=moderate
      - uses: dtolnay/rust-toolchain@stable
      # The rustsec advisory database against Cargo.lock. The action caches the
      # database and the binary, which a `cargo install cargo-audit` does not.
      #
      # This half reports and does not gate, which is the opposite of the bun
      # half above and is not an oversight. `cargo-audit` has no severity floor
      # to raise: it reports what it finds. What it finds today is six
      # advisories, every one of them transitive through tauri or web-push and
      # none of them fixable from this repository — and RUSTSEC-2023-0071
      # against `rsa` (via web-push-native -> jwt-simple -> superboring) has no
      # patched version published at all. Gating on that is gating on a
      # condition nobody here can clear, which trains people to merge past a red
      # check. The output is in the job log and dependabot moves the versions
      # when upstream does.
      - uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The desktop code the job above never compiles. `paint_frame_gap` is
  # `#[cfg(windows)]` and the fullscreen observer is `#[cfg(target_os = "macos")]`,
  # so a Linux `cargo check --workspace` type-checks neither, and the first thing
  # that ever built them was the release bundle: after the tag, with the signing
  # key already in play. A `windows` bump to a version tauri is not on did
  # exactly that — every `win.hwnd()` call stopped compiling while ci stayed
  # green — and nothing would have said so before the four platform runners
  # started. Two runs here are cheaper than a release that fails half way.
  #
  # It runs the workspace, not just `-p boite`, and it lints and tests rather
  # than checking. `boite-core` carries twenty-odd `cfg(windows)` and
  # `cfg(target_os = "macos")` sites of its own — the shell it spawns, the paths
  # it joins, the editor it opens — and its three hundred tests only ever ran on
  # Linux, where none of those arms exist. Clippy subsumes the `cargo check`
  # this replaces: it type-checks everything it lints.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Same reason as the rust job: the tauri build script resolves externalBin
      # before compiling anything, so the sidecar has to exist under the host
      # triple's name. A debug build satisfies it.
      - name: Sidecar placeholder
        shell: bash
        run: |
          cargo build -p boite-mcp
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; else ext=""; fi
          cp "target/debug/boite-mcp$ext" "src-tauri/binaries/boite-mcp-$triple$ext"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # The real-time path — spawn, live output, detach, replay on reattach, two
  # devices on one thread — is what a broken release breaks first, and the unit
  # tests in rpc.rs, ws.rs and auth.rs do not reach it: they cover routing,
  # scopes and the ticket, none of which needs a live PTY. The script that does
  # cover it has existed since the server did and was never run by anything.
  # This job is that missing call.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          # server-smoke.mjs is dependency-free and leans on a global
          # WebSocket, which lands in Node 22.
          node-version: 22
      # remote-smoke.ts imports the backend's own TypeScript, which bun runs
      # directly and node does not.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun deps
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      # Its own key, with the rust job's as a fallback. It used to carry that
      # job's exact key, described as reusing "whatever it just compiled".
      # There is no `needs: rust` here, the two run at the same time, so the
      # restore happened before rust had written anything and boite-server was
      # built from scratch on every run. Worse, an identical key means only
      # whichever job finishes first ever saves: the other is refused as a
      # duplicate, so the entry never held both trees.
      #
      # Keeping them parallel is worth more than the serialisation a `needs:`
      # would buy, so this saves under its own name and falls back through
      # `restore-keys` to the rust job's entry from an earlier run, which does
      # contain boite-server's dependencies.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-
            ${{ runner.os }}-cargo-
      - name: Build the server
        run: cargo build -p boite-server
      - name: Start it
        env:
          BOITE_TOKEN: test
          BOITE_BIND: 127.0.0.1:7337
          BOITE_DATA_DIR: ${{ runner.temp }}/boite-smoke
        run: |
          set -euo pipefail
          ./target/debug/boite-server > "${{ runner.temp }}/server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/server.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/7337) 2>/dev/null; then
              echo "listening"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::boite-server never started listening on 127.0.0.1:7337" >&2
          cat "${{ runner.temp }}/server.log" >&2
          exit 1
      - name: Smoke the real-time path
        env:
          BOITE_TOKEN: test
          SMOKE_URL: ws://127.0.0.1:7337/ws
          SMOKE_CWD: ${{ github.workspace }}
        run: node scripts/server-smoke.mjs
      # The client half. server-smoke speaks the wire protocol itself, which
      # tests the server and nothing that talks to it; RemoteBackend is what
      # every phone and browser session actually runs, it has no unit test worth
      # the name, and the script that drives it against a live server has been
      # sitting in scripts/ unrun since it was written. It wants its own server
      # on the port it was written against.
      - name: Start a server for the client gate
        env:
          BOITE_TOKEN: test
          BOITE_BIND: 127.0.0.1:7399
          BOITE_DATA_DIR: ${{ runner.temp }}/boite-remote
        run: |
          set -euo pipefail
          ./target/debug/boite-server > "${{ runner.temp }}/remote.log" 2>&1 &
          echo $! > "${{ runner.temp }}/remote.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/7399) 2>/dev/null; then
              echo "listening"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::boite-server never started listening on 127.0.0.1:7399" >&2
          cat "${{ runner.temp }}/remote.log" >&2
          exit 1
      - name: Smoke the remote backend
        env:
          BOITE_TOKEN: test
        run: bun scripts/remote-smoke.ts
      - name: Client gate server log
        if: always()
        run: cat "${{ runner.temp }}/remote.log" || true
      - name: Stop the client gate server
        if: always()
        run: kill "$(cat "${{ runner.temp }}/remote.pid")" 2>/dev/null || true
      # The server's own stderr is the only place a spawn refusal or a store
      # error says why, and a failed smoke gives no hint on its own.
      - name: Server log
        if: always()
        run: cat "${{ runner.temp }}/server.log" || true
      - name: Stop it
        if: always()
        run: kill "$(cat "${{ runner.temp }}/server.pid")" 2>/dev/null || true

  # The Android wrapper. `mobile/` is a gradle project that reads its version
  # out of package.json and its host out of app/build.gradle, and until now the
  # only thing that ever compiled it was a laptop with a keystore on it: a
  # dependency bump, a manifest edit or a Bubblewrap regeneration could break
  # the build and nothing would say so before somebody wanted an APK. This is
  # the same shape as the `desktop` job above, code that ci never compiled.
  #
  # Unsigned on purpose. The release keystore is the one secret this workflow
  # must never hold (see mobile/README.md), and an unsigned APK is enough to
  # prove the wrapper builds and to sideload onto a device with `apksigner`
  # run by hand. It is kept as a run artifact so a pull request that touches
  # the wrapper can be installed and looked at without a release.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches the wrapper distribution and the dependency jars, keyed on the
      # gradle files. The runner image carries the Android SDK already, with
      # the licences accepted, and AGP downloads a platform it is missing.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        working-directory: mobile
        run: ./gradlew assembleRelease
      # One file, named after the version the gradle script read, so the
      # artifact says what it is once it is downloaded and renamed by nobody.
      - name: Name it
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          src=mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$src"
          mkdir -p "${{ runner.temp }}/apk"
          cp "$src" "${{ runner.temp }}/apk/boite-$version-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: boite-android-unsigned
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
