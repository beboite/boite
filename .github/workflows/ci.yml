name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: true
      channel:
        type: string
        default: stable
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: bun scripts/ci/changes.ts
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: runner.os == 'Linux'
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js') }}-
      - run: bun run check
        if: runner.os == 'Linux'
      - run: bun run --cwd packages/core test
      - run: bun run --cwd packages/ui test --maxWorkers=8
        if: runner.os == 'Linux'

  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: apps/shell/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name != 'pull_request' }}
      - run: bun run test:shell
      - name: Set nightly artifact version
        if: inputs.channel == 'nightly' && inputs.version != ''
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: bun scripts/ci/nightly-build.ts
      - name: Build installer once
        env:
          BUILD_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          if ($env:BUILD_CHANNEL -eq 'nightly') {
            bun run build:shell:nightly
          } elseif ($env:BUILD_CHANNEL -eq 'stable') {
            bun run build:shell
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run apps/shell/scripts/stage-sidecar.ts
      - run: bun run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: desktop-failure-captures
          path: tests/e2e/.artifacts/
          retention-days: 7

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server.yml

  required:
    name: CI required
    if: always()
    needs: [changes, checks, desktop, server]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          required = jobs['changes']['outputs']['code'] == 'true'
          for name in ('checks', 'desktop', 'server'):
              assert jobs[name]['result'] == ('success' if required else 'skipped'), jobs
          print('All applicable checks passed')
          PY
