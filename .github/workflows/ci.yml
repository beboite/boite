name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: true
      skip-server:
        type: boolean
        default: false
      channel:
        type: string
        default: stable
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      server: ${{ steps.filter.outputs.server == 'true' && !inputs.skip-server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: bun scripts/ci/changes.ts
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci
      - run: bun run check:architecture
      - run: bun test scripts/architecture
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run --cwd packages/core test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js') }}-
      - run: bun run check
      - run: bun run --cwd packages/ui test --maxWorkers=8

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/shell/src-tauri -> target
          shared-key: desktop-release-v1
      - name: Set nightly artifact version
        if: inputs.channel == 'nightly' && inputs.version != ''
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: bun scripts/ci/nightly-build.ts
      - name: Build installer once
        env:
          BUILD_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          if ($env:BUILD_CHANNEL -eq 'nightly') {
            bun run build:shell:nightly
          } elseif ($env:BUILD_CHANNEL -eq 'stable') {
            bun run build:shell
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run apps/shell/scripts/stage-sidecar.ts
      - run: bun run test:shell --release
      - run: bun test tests/e2e
        env:
          BOITE_E2E_PREBUILT_UI: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer
          path: apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: desktop-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  desktop-portable:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test core on additional architectures
        if: matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-15-intel'
        run: bun run --cwd packages/core test
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 xdg-utils
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/shell/src-tauri -> target
          shared-key: desktop-portable-v1
      - run: bun run stage:core
      - run: bun run test:shell --release
      - name: Build and test installed Linux package
        if: runner.os == 'Linux'
        run: |
          bun apps/shell/scripts/tauri.ts build --config src-tauri/tauri.bundle.conf.json --bundles deb
          sudo dpkg -i apps/shell/src-tauri/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a bun scripts/ci/desktop-smoke.ts /usr/bin/boite-shell
      - name: Bundle and test Linux AppImage
        if: runner.os == 'Linux'
        run: |
          bun apps/shell/scripts/tauri.ts bundle --config src-tauri/tauri.bundle.conf.json --bundles appimage --verbose
          mkdir "$RUNNER_TEMP/appimage"
          appimage=$(realpath apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP/appimage" && "$appimage" --appimage-extract > /dev/null)
          if [ "$(uname -m)" = aarch64 ]; then
            cmp packages/core/dist/boite-core "$RUNNER_TEMP/appimage/squashfs-root/usr/bin/boite-core"
          fi
          dbus-run-session -- xvfb-run -a bun scripts/ci/desktop-smoke.ts "$RUNNER_TEMP/appimage/squashfs-root/AppRun"
      - name: Build and test macOS application bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          bun apps/shell/scripts/tauri.ts build --config src-tauri/tauri.bundle.conf.json --bundles app
          cp -R apps/shell/src-tauri/target/release/bundle/macos/Boite.app "$RUNNER_TEMP/Boite.app"
          bun scripts/ci/desktop-smoke.ts "$RUNNER_TEMP/Boite.app/Contents/MacOS/boite-shell"
          ditto -c -k --keepParent "$RUNNER_TEMP/Boite.app" "$RUNNER_TEMP/Boite-macos.zip"
      - name: Diagnose Linux packaging failures
        if: failure() && runner.os == 'Linux'
        run: |
          patchelf --version
          for binary in packages/core/dist/boite-core apps/shell/src-tauri/target/release/bundle/appimage/Boite.AppDir/usr/bin/boite-core; do
            if [ -f "$binary" ]; then
              file "$binary"
              ldd "$binary" || true
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/shell/src-tauri/target/release/bundle/deb/*.deb
            apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage
            ${{ runner.temp }}/Boite-macos.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server.yml

  required:
    name: CI required
    if: always()
    needs: [changes, core, web, desktop, desktop-portable, server]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          for name in ('core', 'web', 'desktop', 'desktop-portable', 'server'):
              required = jobs['changes']['outputs']['desktop' if name == 'desktop-portable' else name] == 'true'
              assert jobs[name]['result'] == ('success' if required else 'skipped'), jobs
          print('All applicable checks passed')
          PY
