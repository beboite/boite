name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Required only when sign-updates is enabled.
        required: false
      # A published macOS build is signed with this Developer ID and notarized
      # when all six are set; without them it stays ad-hoc signed.
      APPLE_CERTIFICATE:
        description: Base64 of the Developer ID Application .p12.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Developer ID Application: <name> (<team id>).'
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID, for notarization.
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        description: Contents of the AuthKey_<id>.p8 file.
        required: false
    inputs:
      force:
        type: boolean
        default: true
      skip-server:
        type: boolean
        default: false
      sign-updates:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    name: Plan and repository checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # A main push compares with the last main commit whose CI passed (changes.ts).
      actions: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      server: ${{ steps.filter.outputs.server == 'true' && !inputs.skip-server }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      e2eTypes: ${{ steps.filter.outputs.e2eTypes }}
      stress: ${{ steps.filter.outputs.stress }}
      portable: ${{ steps.filter.outputs.portable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: bun scripts/ci/changes.ts
      - run: bun install --frozen-lockfile
      - name: Audit frozen dependencies
        run: bun audit
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci ./bench ./apps/shell/scripts
      # Missing sentences are warnings here and in the nightly; release.yml refuses them.
      - run: bun scripts/ci/translations.ts
      - run: bun run check:architecture
      - run: bun test scripts/architecture
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  core:
    name: Core tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux arm64 }
          - { os: windows-2025, name: Windows x64 }
          - { os: macos-15, name: macOS arm64 }
          - { os: macos-15-intel, name: macOS x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run --cwd packages/core test

  web:
    name: Type checks and UI tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Caches are saved on main only: a pull request's copy is visible to that
      # pull request alone and would evict the ones every pull request restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-
      - run: bun run check
      - run: bun run --cwd packages/ui test --maxWorkers=8
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}

  telemetry:
    name: Telemetry relay tests
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test packages/core/test/telemetry.test.ts

  e2e-types:
    name: E2E type check
    needs: changes
    if: needs.changes.outputs.e2eTypes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:e2e

  stress:
    name: Stress fixtures
    needs: changes
    if: needs.changes.outputs.stress == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_STRESS_ARTIFACTS: tests/e2e/.artifacts/stress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      # Fixed protocol, unhealthy-core and echo fixtures use temporary data only.
      # Preserve all three distinct scenarios and their existing deadlines.
      - run: bun run test:stress
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: stress-fixture-evidence
          path: tests/e2e/.artifacts/stress/
          retention-days: 7

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      APPLE_CERTIFICATE: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign-updates && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ inputs.sign-updates && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ inputs.sign-updates && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.APPLE_API_PRIVATE_KEY || '' }}
    with:
      platforms: ${{ needs.changes.outputs.portable }}
      sign-updates: ${{ inputs.sign-updates == true }}
      native-e2e: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read

  e2e:
    name: E2E ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - name: Prepare end-to-end tests
        run: bun tests/e2e/lib/warm.ts $env:BOITE_E2E_FAKE_UI
      # Each runner has its own Vite cache. Files stay sequential within a shard.
      # The native shell file runs against the installer in the desktop job.
      - name: Browser and core end-to-end tests
        run: |
          $files = @(Get-ChildItem tests/e2e -Recurse -Filter *.test.ts | Where-Object { $_.FullName -ne (Join-Path $PWD 'tests/e2e/shell.test.ts') } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No browser or core E2E files found' }
          bun test @files --shard=${{ matrix.shard }}/3
      - uses: ./.github/actions/upload-artifact
        if: failure() || cancelled()
        with:
          name: e2e-${{ matrix.shard }}-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/server-verify.yml

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  required:
    name: CI required
    if: always()
    needs: [changes, core, web, telemetry, e2e-types, stress, desktop, e2e, server, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          for name in ('core', 'web', 'telemetry', 'e2e-types', 'stress', 'desktop', 'server', 'android'):
              output = {'e2e-types': 'e2eTypes'}.get(name, name)
              required = jobs['changes']['outputs'][output] == 'true'
              assert jobs[name]['result'] == ('success' if required else 'skipped'), jobs
          e2e_required = jobs['changes']['outputs']['desktop'] == 'true' and jobs['changes']['outputs']['e2e'] == 'true'
          assert jobs['e2e']['result'] == ('success' if e2e_required else 'skipped'), jobs
          print('All applicable checks passed')
          PY
