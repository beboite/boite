name: ci

on:
  push:
    branches: [main]
  # A draft runs the Linux checks; ready_for_review starts the full run, and
  # converted_to_draft cancels one in progress (changes.ts).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Required only when sign-updates is enabled.
        required: false
      # A published macOS build is signed with this Developer ID and notarized
      # when all six are set; without them it stays ad-hoc signed.
      APPLE_CERTIFICATE:
        description: Base64 of the Developer ID Application .p12.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Developer ID Application: <name> (<team id>).'
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID, for notarization.
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        description: Contents of the AuthKey_<id>.p8 file.
        required: false
    inputs:
      force:
        type: boolean
        default: true
      skip-server:
        type: boolean
        default: false
      sign-updates:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    name: Plan and repository checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # A main push compares with the last main commit whose CI passed (changes.ts).
      actions: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shellRust: ${{ steps.filter.outputs.shellRust }}
      server: ${{ steps.filter.outputs.server == 'true' && !inputs.skip-server }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      e2eTypes: ${{ steps.filter.outputs.e2eTypes }}
      stress: ${{ steps.filter.outputs.stress }}
      portable: ${{ steps.filter.outputs.portable }}
      coreRunners: ${{ steps.filter.outputs.coreRunners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: bun scripts/ci/changes.ts
      - run: bun install --frozen-lockfile
      - name: Audit frozen dependencies
        run: bun audit
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci ./bench ./apps/shell/scripts
      # Missing sentences are warnings here and in the nightly; release.yml refuses them.
      - run: bun scripts/ci/translations.ts
      - run: bun run check:architecture
      - run: bun test scripts/architecture
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # One job per runner of CORE_ALL in changes.ts, not a matrix: a skipped job
  # then reports its own fixed name (docs/ci.md#check-names). Each runs when
  # coreRunners lists its label; the quotes keep `ubuntu-24.04` from matching
  # `ubuntu-24.04-arm`. Pull requests leave out the Intel Mac.
  core-linux-x64:
    name: Core tests (Linux x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04"')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: &core-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Core data directories, worktrees and Chrome profiles go to the runner's
      # temp drive (D: on Windows), as in the E2E shards (docs/ci.md#build-cost).
      - run: bun run --cwd packages/core test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  core-linux-arm64:
    name: Core tests (Linux arm64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04-arm"')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps: *core-steps

  core-windows-x64:
    name: Core tests (Windows x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"windows-2025"')
    runs-on: windows-2025
    timeout-minutes: 15
    steps: *core-steps

  core-macos-arm64:
    name: Core tests (macOS arm64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15"')
    runs-on: macos-15
    timeout-minutes: 15
    steps: *core-steps

  core-macos-x64:
    name: Core tests (macOS x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15-intel"')
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps: *core-steps

  web:
    name: Type checks and UI tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Caches are saved on main only: a pull request's copy is visible to that
      # pull request alone and would evict the ones every pull request restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-
      - run: bun run check
      - run: bun run --cwd packages/ui test --maxWorkers=8
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}

  telemetry:
    name: Telemetry relay tests
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test packages/core/test/telemetry.test.ts

  e2e-types:
    name: E2E type check
    needs: changes
    if: needs.changes.outputs.e2eTypes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:e2e

  # The UI the E2E shards and stress test, built once. Vite emits the same
  # chunks on Linux and Windows except for a CSS color rounded in its sixth
  # decimal and the gzip OS byte (docs/ci.md#e2e-preparation).
  ui:
    name: Build UI
    needs: changes
    if: needs.changes.outputs.stress == 'true' || (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - name: Build the fake-client E2E bundle
        run: bun tests/e2e/lib/warm.ts --build-only tests/e2e/.artifacts/fake-ui
      # The production UI keeps its dot folder: .well-known/assetlinks.json.
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-dist
          path: packages/ui/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  stress:
    name: Stress fixtures
    needs: [changes, ui]
    if: needs.changes.outputs.stress == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_STRESS_ARTIFACTS: tests/e2e/.artifacts/stress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      # Fixed protocol, unhealthy-core and echo fixtures use temporary data only.
      # Preserve all three distinct scenarios and their existing deadlines.
      - run: bun run test:stress
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: stress-fixture-evidence
          path: tests/e2e/.artifacts/stress/
          retention-days: 7

  # The callers of reusable workflows always run and pass `enabled`: a skipped
  # caller reports one check named after itself, a running one each inner
  # job's name, skipped or not (docs/ci.md#check-names).
  desktop:
    name: Desktop
    needs: changes
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      APPLE_CERTIFICATE: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign-updates && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ inputs.sign-updates && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ inputs.sign-updates && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.APPLE_API_PRIVATE_KEY || '' }}
    with:
      enabled: ${{ needs.changes.outputs.desktop == 'true' }}
      platforms: ${{ needs.changes.outputs.portable }}
      # Only apps/shell, two embedded page scripts and shared inputs reach them (changes.ts).
      rust-tests: ${{ needs.changes.outputs.shellRust == 'true' }}
      sign-updates: ${{ inputs.sign-updates == true }}
      native-e2e: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read

  # Three shards written out, not a matrix, for the same fixed names as the
  # core jobs. E2E_SHARD picks the shard's files.
  e2e-1:
    name: E2E 1/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 1
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui
      # Chrome profiles and core data directories go to the runner's temp
      # drive (D:). On C:, Chrome stalled page loads for 15 to 60 s while the
      # UI server had answered: 8 stalls in 5 of 9 shard runs against 0 in 9,
      # and 706 s of tests against 420 s (PR #513, 2026-10-15).
      - name: Prepare end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun tests/e2e/lib/warm.ts --prebuilt $env:BOITE_E2E_FAKE_UI
      # Each runner has its own Vite cache. Files stay sequential within a shard.
      # The native shell file runs against the installer in the desktop job.
      # Shards are cut on recorded seconds per file (scripts/ci/e2e-shards.ts).
      - name: Browser and core end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $files = @(bun scripts/ci/e2e-shards.ts $env:E2E_SHARD 3)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'No browser or core E2E files for this shard' }
          # A quarantined test that fails runs once more (scripts/ci/quarantine.json).
          bun scripts/ci/flaky.ts @files
      - uses: ./.github/actions/upload-artifact
        if: failure() || cancelled()
        with:
          name: e2e-${{ env.E2E_SHARD }}-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  e2e-2:
    name: E2E 2/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 2
    steps: *e2e-steps

  e2e-3:
    name: E2E 3/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 3
    steps: *e2e-steps

  server:
    name: Server
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/server-verify.yml
    with:
      enabled: ${{ needs.changes.outputs.server == 'true' }}

  android:
    name: Android
    needs: changes
    uses: ./.github/workflows/android.yml
    with:
      enabled: ${{ needs.changes.outputs.android == 'true' }}

  required:
    # A draft's gate has another name: a green `CI required` on a head is a
    # full run, which branch protection may trust after the PR turns ready.
    name: ${{ github.event.pull_request.draft == true && 'CI draft' || 'CI required' }}
    if: always()
    needs: [changes, core-linux-x64, core-linux-arm64, core-windows-x64, core-macos-arm64, core-macos-x64, web, telemetry, e2e-types, stress, desktop, e2e-1, e2e-2, e2e-3, server, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          outputs = jobs['changes']['outputs']
          def require(name, required):
              assert jobs[name]['result'] == ('success' if required else 'skipped'), jobs
          for name in ('web', 'telemetry', 'e2e-types', 'stress'):
              require(name, outputs[{'e2e-types': 'e2eTypes'}.get(name, name)] == 'true')
          # A core job is required when its runner is in this run's coreRunners.
          runners = [runner['os'] for runner in json.loads(outputs['coreRunners'])]
          core = {'core-linux-x64': 'ubuntu-24.04', 'core-linux-arm64': 'ubuntu-24.04-arm', 'core-windows-x64': 'windows-2025',
                  'core-macos-arm64': 'macos-15', 'core-macos-x64': 'macos-15-intel'}
          for name, runner in core.items():
              require(name, outputs['core'] == 'true' and runner in runners)
          for name in ('e2e-1', 'e2e-2', 'e2e-3'):
              require(name, outputs['desktop'] == 'true' and outputs['e2e'] == 'true')
          # A caller runs its reusable workflow with `enabled` off when not selected,
          # which skips every job in it.
          for name in ('desktop', 'server', 'android'):
              assert jobs[name]['result'] == 'success' or (outputs[name] != 'true' and jobs[name]['result'] == 'skipped'), jobs
          print('All applicable checks passed')
          PY
