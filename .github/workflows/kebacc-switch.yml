name: kebacc-switch

# The switcher lives in this repository but ships on its own clock: its crate
# carries its own version and its releases are tagged `kebacc-switch-v5.1.0`,
# which is what `kebacc-switch update` looks for. Boite's own `v*` tags are a
# different channel and this workflow ignores them.
#
# Asset names are a contract, not a convention: `cmd/update.rs` builds the name
# it downloads out of the target triple, so renaming a file here silently turns
# the auto-update off for that platform.
on:
  push:
    tags: ["kebacc-switch-v*"]
  workflow_dispatch:

# Read by default: only the last job needs to create a release, and the four
# build jobs have no business holding a token that can write to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The crate version is the tag
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version = ' crates/kebacc-switch/Cargo.toml | cut -d'"' -f2)
          echo "crates/kebacc-switch/Cargo.toml=$crate"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "kebacc-switch-v$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $crate" >&2
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # Only this crate is built, so the cache key is its own lockfile slice
      # rather than the whole workspace: a change to the Tauri side has no
      # business invalidating a switcher build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-kebacc-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-kebacc-

      - name: Build
        run: cargo build --release --locked -p kebacc-switch --target ${{ matrix.target }}

      # The name the updater will ask for. `EXE_SUFFIX` on the reading side is
      # `.exe` on Windows and empty everywhere else, and this matches it.
      - name: Name the binary after its target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/kebacc-switch.exe" \
               "dist/kebacc-switch-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/kebacc-switch" \
               "dist/kebacc-switch-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kebacc-switch-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # A run started by hand sits on a branch, not a tag, and there is nothing to
  # release from a branch: the build above is the whole point of that run.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List what will ship
        run: ls -l dist

      # `gh` rather than a release action: this is one API call, and every
      # third-party action in this job is another party who can decide what
      # lands on the machines that auto-update from it.
      #
      # Published, not drafted: an installed switcher only sees a release once
      # it is out, and a draft nobody remembers to publish reads to every
      # machine as "no update exists".
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(ls dist | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::nothing was built" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*             --repo "$GITHUB_REPOSITORY"             --title "$GITHUB_REF_NAME"             --notes "kebacc-switch $GITHUB_REF_NAME"

