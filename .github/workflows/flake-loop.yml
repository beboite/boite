name: flake-loop

# Runs flaky tests many times on the runners where they fail, with timing
# traces, to find a cause and to prove a fix (docs/ci.md#checks). A pull
# request runs it once it carries the `flake-loop` label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per job.
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: flake-loop-${{ github.event.pull_request.number || github.ref }}
  # A loop already running keeps its data; a newer head waits for it.
  cancel-in-progress: false

env:
  RUNS: ${{ inputs.runs || 10 }}

jobs:
  browser:
    name: Core browser files (${{ matrix.name }}, ${{ matrix.parallel }} at once, Spotlight ${{ matrix.spotlight }})
    # Parked while the cli loop runs alone after #635: set the FLAKE_LOOP_ALL variable to 1 to run it.
    if: vars.FLAKE_LOOP_ALL == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium stopped answering at a load of 25 to 53, with Spotlight's mdworker_shared and mds
          # the busiest processes, temp folder on disk or in RAM alike (run 39197082818). The same loop
          # with indexing off.
          - { os: macos-15, name: macOS arm64, parallel: 4, spotlight: on }
          - { os: macos-15, name: macOS arm64, parallel: 4, spotlight: off }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      BOITE_CDP_TRACE: '1'
      FLAKE_LOOP_TITLE: Core browser files, ${{ matrix.name }}, ${{ matrix.parallel }} at once, Spotlight ${{ matrix.spotlight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Spotlight off
        if: matrix.spotlight == 'off'
        run: |
          sudo mdutil -a -i off
          mdutil -a -s
      - run: |
          mkdir -p flake-loop
          # Disk throughput and load each second, to line a stall up with the disk.
          (while true; do echo "$(date -u +%H:%M:%S) $(iostat -d -c 2 -w 1 disk0 | tail -1) $(sysctl -n vm.loadavg)"; done > flake-loop/iostat.txt 2>&1 &)
          # The five busiest processes every 5 s, to see what indexes or scans while Chromium stalls.
          (while true; do echo "== $(date -u +%H:%M:%S)"; ps -Aro pcpu,rss,comm | head -6; sleep 5; done > flake-loop/top.txt 2>&1 &)
          bun scripts/ci/flake-loop.ts --runs "$RUNS" --parallel ${{ matrix.parallel }} --cwd packages/core --out flake-loop test/browser-sharing.test.ts test/browser.test.ts test/browser-sleep.test.ts test/browser-profile-lifecycle.test.ts
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-browser-${{ matrix.os }}-${{ matrix.parallel }}-spotlight-${{ matrix.spotlight }}
          path: flake-loop/

  cli:
    name: cli.test.ts (${{ matrix.name }}, Bun ${{ matrix.bun }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'flake-loop')
    strategy:
      fail-fast: false
      matrix:
        # The 1002 closes on macOS, 200 runs four at a time: 5 with #623, 11 (as 1006) on Bun canary.
        # The same loop once #623 is reverted (#635).
        include:
          - { os: macos-15, name: macOS arm64, bun: pinned }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FLAKE_LOOP_TITLE: cli.test.ts, ${{ matrix.name }}, Bun ${{ matrix.bun }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Four copies at once load the runner as the core suite's four workers do.
      - shell: bash
        run: bun scripts/ci/flake-loop.ts --runs "$((RUNS * 20))" --parallel 4 --cwd packages/core --out flake-loop test/cli.test.ts test/cli.test.ts test/cli.test.ts test/cli.test.ts
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-cli-${{ matrix.os }}-${{ matrix.bun }}
          path: flake-loop/

  e2e:
    name: E2E ${{ matrix.mode }}
    # Parked while the cli loop runs alone after #635: set the FLAKE_LOOP_ALL variable to 1 to run it.
    if: vars.FLAKE_LOOP_ALL == '1'
    strategy:
      fail-fast: false
      matrix:
        mode: [alone, shard 1, shard 2, shard 3]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      BOITE_E2E_TRACE: '1'
      FLAKE_LOOP_TITLE: E2E ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - run: bun tests/e2e/lib/warm.ts --build-only $env:BOITE_E2E_FAKE_UI
      # Same temp drive as the E2E job in ci.yml.
      - name: Prepare end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun tests/e2e/lib/warm.ts --prebuilt $env:BOITE_E2E_FAKE_UI
      - name: Loop
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          MODE: ${{ matrix.mode }}
        run: |
          if ($env:MODE -eq 'alone') {
            $files = @('tests/e2e/coordination-bridge-live.test.ts', 'tests/e2e/machines.test.ts'); $runs = [int]$env:RUNS * 2; $together = @()
          } else {
            $shard = $env:MODE.Split(' ')[1]
            $files = @(bun scripts/ci/e2e-shards.ts $shard 3)
            if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw "No E2E files for $env:MODE" }
            $runs = [math]::Max(1, [int]([int]$env:RUNS / 2)); $together = @('--together')
          }
          New-Item -ItemType Directory -Force flake-loop/devtools | Out-Null
          $env:BOITE_E2E_TRACE_DIR = (Resolve-Path flake-loop/devtools).Path
          # A page stall lines up with these: is the disk under Chrome's profile slow then, and is Defender scanning it?
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled | Format-List | Out-File flake-loop/defender.txt
          (Get-MpPreference).ExclusionPath | Out-File -Append flake-loop/defender.txt
          Get-Content flake-loop/defender.txt
          $perf = Start-Process typeperf -ArgumentList @('\PhysicalDisk(*)\Avg. Disk sec/Transfer', '\PhysicalDisk(*)\Current Disk Queue Length', '\Processor(_Total)\% Processor Time', '\Process(MsMpEng)\% Processor Time', '-si', '1', '-f', 'CSV', '-o', (Join-Path $PWD 'flake-loop/perf.csv'), '-y') -PassThru -WindowStyle Hidden
          bun scripts/ci/flake-loop.ts --runs $runs --out flake-loop @together @files
          $code = $LASTEXITCODE
          Stop-Process -Id $perf.Id -ErrorAction SilentlyContinue
          exit $code
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-e2e-${{ matrix.mode == 'alone' && 'alone' || format('shard{0}', strategy.job-index) }}
          path: flake-loop/
