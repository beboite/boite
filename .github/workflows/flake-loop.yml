name: flake-loop

# Runs flaky tests many times on the runners where they fail, with timing
# traces, to find a cause and to prove a fix (docs/ci.md#checks). A pull
# request runs it once it carries the `flake-loop` label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per job.
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: flake-loop-${{ github.event.pull_request.number || github.ref }}
  # A loop already running keeps its data; a newer head waits for it.
  cancel-in-progress: false

env:
  RUNS: ${{ inputs.runs || 10 }}

jobs:
  browser:
    name: Core browser files (${{ matrix.name }}, ${{ matrix.parallel }} at once, temp on ${{ matrix.temp }})
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium stopped answering with its processes idle and a load of 9 to 29:
          # does the runner's disk stall it? The same loop with the temp folder in RAM.
          - { os: macos-15, name: macOS arm64, parallel: 4, temp: disk }
          - { os: macos-15, name: macOS arm64, parallel: 4, temp: ram }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      BOITE_CDP_TRACE: '1'
      FLAKE_LOOP_TITLE: Core browser files, ${{ matrix.name }}, ${{ matrix.parallel }} at once, temp on ${{ matrix.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Temp folder in RAM
        if: matrix.temp == 'ram'
        run: |
          # 2 GiB in 512-byte sectors.
          device=$(hdiutil attach -nomount ram://4194304 | tr -d '[:space:]')
          diskutil erasevolume APFS boite-ram "$device"
          mkdir -p /Volumes/boite-ram/tmp
          echo "TMPDIR=/Volumes/boite-ram/tmp/" >> "$GITHUB_ENV"
      - run: |
          mkdir -p flake-loop
          # Disk throughput and load each second, to line a stall up with the disk.
          (while true; do echo "$(date -u +%H:%M:%S) $(iostat -d -c 2 -w 1 disk0 | tail -1) $(sysctl -n vm.loadavg)"; done > flake-loop/iostat.txt 2>&1 &)
          bun scripts/ci/flake-loop.ts --runs "$RUNS" --parallel ${{ matrix.parallel }} --cwd packages/core --out flake-loop test/browser-sharing.test.ts test/browser.test.ts test/browser-sleep.test.ts test/browser-profile-lifecycle.test.ts
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-browser-${{ matrix.os }}-${{ matrix.parallel }}-${{ matrix.temp }}
          path: flake-loop/

  cli:
    name: cli.test.ts (${{ matrix.name }})
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux x64 }
          - { os: macos-15, name: macOS arm64 }
          - { os: windows-2025, name: Windows x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLAKE_LOOP_TITLE: cli.test.ts, ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Four copies at once load the runner as the core suite's four workers do.
      - shell: bash
        run: bun scripts/ci/flake-loop.ts --runs "$((RUNS * 2))" --parallel 4 --cwd packages/core --out flake-loop test/cli.test.ts test/cli.test.ts test/cli.test.ts test/cli.test.ts
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-cli-${{ matrix.os }}
          path: flake-loop/

  e2e:
    name: E2E ${{ matrix.mode }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'flake-loop')
    strategy:
      fail-fast: false
      matrix:
        mode: [alone]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      BOITE_E2E_TRACE: '1'
      FLAKE_LOOP_TITLE: E2E ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - run: bun tests/e2e/lib/warm.ts --build-only $env:BOITE_E2E_FAKE_UI
      # Same temp drive as the E2E job in ci.yml.
      - name: Prepare end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun tests/e2e/lib/warm.ts --prebuilt $env:BOITE_E2E_FAKE_UI
      - name: Loop
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          MODE: ${{ matrix.mode }}
        run: |
          if ($env:MODE -eq 'alone') {
            $files = @('tests/e2e/machines.test.ts'); $runs = [int]$env:RUNS * 4; $together = @()
          } else {
            $shard = $env:MODE.Split(' ')[1]
            $files = @(bun scripts/ci/e2e-shards.ts $shard 3)
            if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw "No E2E files for $env:MODE" }
            $runs = [math]::Max(1, [int]([int]$env:RUNS / 2)); $together = @('--together')
          }
          New-Item -ItemType Directory -Force flake-loop/devtools | Out-Null
          $env:BOITE_E2E_TRACE_DIR = (Resolve-Path flake-loop/devtools).Path
          # A page stall lines up with these: is the disk under Chrome's profile slow then, and is Defender scanning it?
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled | Format-List | Out-File flake-loop/defender.txt
          (Get-MpPreference).ExclusionPath | Out-File -Append flake-loop/defender.txt
          Get-Content flake-loop/defender.txt
          $perf = Start-Process typeperf -ArgumentList @('\PhysicalDisk(*)\Avg. Disk sec/Transfer', '\PhysicalDisk(*)\Current Disk Queue Length', '\Processor(_Total)\% Processor Time', '\Process(MsMpEng)\% Processor Time', '-si', '1', '-f', 'CSV', '-o', (Join-Path $PWD 'flake-loop/perf.csv'), '-y') -PassThru -WindowStyle Hidden
          bun scripts/ci/flake-loop.ts --runs $runs --out flake-loop @together @files
          $code = $LASTEXITCODE
          Stop-Process -Id $perf.Id -ErrorAction SilentlyContinue
          exit $code
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: flake-loop-e2e-${{ matrix.mode == 'alone' && 'alone' || format('shard{0}', strategy.job-index) }}
          path: flake-loop/
