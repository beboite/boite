name: labeler

# pull_request_target runs the base branch's workflow and configuration, so a
# fork can label its pull request without its code ever being checked out here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
