name: image

# Builds the boite-server image and pushes it to GHCR, so deploying to the
# server is `docker compose pull` instead of a full compile on the machine that
# is meant to be serving. The image is the deploy artifact now: nothing ships
# over SFTP, and no source tree lives on the server.
#
# arm64 only, natively, on GitHub's arm64 runner: it is the architecture the
# server runs, and cross-building this Dockerfile under QEMU costs more than
# the deploy it saves. An amd64 leg is one matrix entry away if a second host
# ever needs it.
#
# Actions are pinned by commit SHA, same rule as release.yml: what this
# workflow produces runs as root on the server, so an upstream repo must not be
# able to change what builds it by moving a tag.
# Gated on ci, not on the push. This used to trigger on `push: branches:
# [master]` with its own paths filter, independently of whether anything
# passed: a commit that broke `cargo test` still published the `:latest` the
# server pulls, which is how a release reached the machine broken. Waiting for
# a green ci on the same sha is the whole point of this trigger.
#
# The paths filter goes with it: `workflow_run` cannot carry one, so every
# green master run rebuilds. The registry cache absorbs most of that, and a
# rebuild nobody needed costs a runner, while a publish nobody tested costs the
# server.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A manual dispatch stays possible; an automatic run only follows a ci that
    # actually passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    steps:
      # workflow_run starts from the default branch, not from what ci tested,
      # so the sha is named explicitly: publishing a different tree than the
      # one that went green would defeat the gate this workflow exists for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # The version tag comes from package.json rather than from the git tag:
      # a release tag is pushed on the same commit as the bump, and this
      # workflow runs off the branch push, before that tag exists.
      - name: Read the version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/boite-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile's `--mount=type=cache` directories do not survive
      # between runners, and `COPY . .` invalidates the compile stage on any
      # commit, so the registry cache is what keeps the apt, npm and uv layers
      # from being rebuilt every time. The Rust stage recompiles either way.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What to pull
        run: |
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
