name: server image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      defer-manifest:
        description: Upload tested image digests now; let the caller publish tags after its checks.
        type: boolean
        default: false
      tags:
        description: Newline-separated image tags, without the image name.
        type: string
        default: edge
      channel:
        type: string
        default: stable
      version:
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and load native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: boite-server:test
          build-args: |
            BOITE_CHANNEL=${{ inputs.channel }}
            BOITE_VERSION=${{ inputs.version }}
            BOITE_RELEASE_TELEMETRY=${{ inputs.publish && '1' || '' }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          # Written on main only, like every other cache: see ci.yml.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=server-{0},mode=max', matrix.arch) || '' }}
      - run: bash docker/smoke.sh boite-server:test "$BUILD_CHANNEL" "$BUILD_VERSION"
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          BUILD_VERSION: ${{ inputs.version }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image by digest
        if: inputs.publish
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/boite-server"
          tag="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag boite-server:test "$tag"
          docker push "$tag"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$tag" > "digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.publish
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: inputs.publish && !inputs.defer-manifest
    needs: build
    uses: ./.github/workflows/server-manifest.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ inputs.tags }}
