name: Feature request
description: Describe a workflow boite could support.
type: Feature
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Explain the problem and how you work around it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues for this request.
          required: true
