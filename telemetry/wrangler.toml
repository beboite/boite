name = "boite-v2-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
POSTHOG_INGEST_HOST = "https://eu.i.posthog.com"
POSTHOG_API_HOST = "https://eu.posthog.com"
POSTHOG_PROJECT_ID = "279688"
ENVIRONMENT = "production"
BATCH_MAX_EVENTS = "200"
ALLOWED_ORIGINS = ""
UA_PREFIX = "Boite/"
ALERT_FROM = ""

[[unsafe.bindings]]
name = "RL_TRACK"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_RGPD"
type = "ratelimit"
namespace_id = "3003"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_GLOBAL"
type = "ratelimit"
namespace_id = "3006"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_NOTIFY"
type = "ratelimit"
namespace_id = "3005"
simple = { limit = 1, period = 60 }

[observability]
enabled = false
