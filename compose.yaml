services:
  boite-server:
    image: ${BOITE_IMAGE:-ghcr.io/beboite/boite/boite-server:latest}
    ports:
      - "${BOITE_BIND:-127.0.0.1}:7337:7337"
    volumes:
      - boite-data:/data
      - boite-home:/home/node
      - boite-workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 30s
    # 0 is no CPU cap. Docker refuses to start a container whose cap exceeds the host's CPU count.
    cpus: ${BOITE_CPUS:-0}
    mem_limit: ${BOITE_MEM:-4g}

volumes:
  boite-data:
  boite-home:
  boite-workspace:
