<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Boite · Démonstration</title>
<style>
  :root{color-scheme:light dark;--paper:#f3f1ea;--ink:#20352c;--card:#fffdf7;--edge:#d5dbd3;--muted:#5c7065;--accent:#2e6049}
  @media(prefers-color-scheme:dark){:root{--paper:#15221c;--ink:#e7eee8;--card:#20342a;--edge:#3c5146;--muted:#a6bbae;--accent:#80c59c}}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge);padding-bottom:18px}.brand{font-weight:750;letter-spacing:.08em}.tag{color:var(--muted);font-size:12px}.hero{padding:32px 0 22px}h1{font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-.035em;margin:8px 0 14px}.hero p{color:var(--muted);max-width:540px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.form{background:var(--card);border:1px solid var(--edge);padding:22px;border-radius:16px}.swatch{height:100px;border-radius:10px;margin-bottom:16px;background:linear-gradient(135deg,#b7cbb3,#496c55)}.ochre{background:linear-gradient(135deg,#ead6ab,#a98147)}.slate{background:linear-gradient(135deg,#aec5cc,#4e737f)}h2{font-size:18px;margin:0 0 10px}button,input{font:inherit;border-radius:8px;padding:9px 13px}button{border:0;background:var(--accent);color:var(--paper);cursor:pointer}button:active{transform:translateY(1px)}.form{margin-top:18px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.row{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid var(--edge);background:var(--paper);color:var(--ink)}#result{color:var(--accent);font-weight:650;min-height:24px}.footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px;margin-top:24px}.secondary{font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--edge)}@media(max-width:600px){main{padding:20px}.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:64px 1fr;gap:0 16px;padding:16px}.swatch{grid-row:span 3;height:85px;margin:0}.card button{justify-self:start}.row{flex-wrap:wrap}.hero{padding-top:18px}.tag{max-width:100px;text-align:right}}
</style>
<main><header><span class="brand">ATELIER BOITE</span><span class="tag">Application de démonstration</span></header><section class="hero"><span class="tag">TEST DU NAVIGATEUR INTÉGRÉ</span><h1>Une page. Tous les formats.</h1><p>Ajoute une couleur à ta sélection, puis envoie ton message. Les contrôles sont utilisables par toi et par l’IA.</p></section>
<section class="grid"><article class="card"><div class="swatch"></div><h2>Forêt</h2><p>Vert profond</p><button id="forest" onclick="choose('Forêt')">Choisir</button></article><article class="card"><div class="swatch ochre"></div><h2>Sable</h2><p>Ocre doux</p><button id="sand" onclick="choose('Sable')">Choisir</button></article><article class="card"><div class="swatch slate"></div><h2>Ardoise</h2><p>Bleu minéral</p><button id="slate" onclick="choose('Ardoise')">Choisir</button></article></section>
<section class="form"><label for="message">Ton message</label><div class="row"><input id="message" placeholder="Écris quelque chose…"><button id="send" onclick="send()">Afficher</button></div><p id="result" role="status">Prêt pour le test.</p></section><div class="footer"><span id="viewport"></span><button class="secondary" id="diagnostic" onclick="diagnose()">Déclencher un diagnostic de test</button></div></main>
<script>
function choose(color){document.querySelector('#result').textContent='Couleur sélectionnée : '+color;console.info('Sélection : '+color)}
function send(){document.querySelector('#result').textContent=document.querySelector('#message').value||'Ajoute un message';console.info('Message affiché')}
function diagnose(){console.warn('Diagnostic volontaire de démonstration');fetch('/missing-demo-resource');setTimeout(()=>{throw new Error('Erreur volontaire de démonstration')},25)}
function measure(){document.querySelector('#viewport').textContent=innerWidth+' × '+innerHeight+' · '+(matchMedia('(prefers-color-scheme: dark)').matches?'Sombre':'Clair')}
addEventListener('resize',measure);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',measure);measure();console.info('Page de test chargée');
</script></html>
