services:
  boite:
    build: .
    # Published by .github/workflows/image.yml for linux/arm64. `docker compose
    # pull` takes the built image, `docker compose build` still overwrites it
    # locally under the same name, so a host on another architecture, or one
    # testing an uncommitted change, keeps working.
    image: ghcr.io/beboite/boite-server:${BOITE_IMAGE_TAG:-latest}
    container_name: boite
    restart: unless-stopped
    ports:
      # Loopback by default, matching the server's own bind default: the token
      # is a static bearer for host-level RCE and travels over plain ws://.
      # Publish wider only behind TLS or a tunnel (e.g. "100.64.0.4:7337:7337"
      # for a Tailscale-only interface).
      - "127.0.0.1:7337:7337"
    environment:
      # Required: the bearer token clients send as the first WS frame.
      - BOITE_TOKEN=${BOITE_TOKEN:?set BOITE_TOKEN in .env}
      - BOITE_BIND=0.0.0.0:7337
      # Optional mobile notifications (ntfy/Discord/Gotify).
      - BOITE_WEBHOOK_URL=${BOITE_WEBHOOK_URL:-}
      - BOITE_WEBHOOK_FORMAT=${BOITE_WEBHOOK_FORMAT:-ntfy}
      # Where this workspace answers from on the internet. Only used to turn the
      # deep link in a notification into one a phone can open; the server is
      # behind a proxy and cannot work it out for itself.
      - BOITE_PUBLIC_URL=${BOITE_PUBLIC_URL:-}
    volumes:
      - ./data:/data # SQLite DB + token
      - ./workspace:/workspace # repos boite operates on
      - ./claude:/root/.claude # claude OAuth creds + sessions
