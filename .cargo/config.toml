# Cargo walks up from the current directory to find this file, so it caps
# every cargo invocation in this repo (`bun run test:shell`, a manual `cargo
# build` or `cargo test` from anywhere under here), not only a script that
# remembered to pass `--jobs`. See `.claude/AGENTS.md`: the shell's Rust build
# is documented as capped at eight jobs so the other cores on this machine
# stay free for whatever else is running; this is what makes that true on any
# machine, including one with no `CARGO_BUILD_JOBS` of its own.
[build]
jobs = 8
