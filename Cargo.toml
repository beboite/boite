[workspace]
members = ["crates/claude-cc", "crates/boite-agent-api", "crates/boite-core", "crates/boite-identity", "crates/boite-mcp", "crates/boite-server", "src-tauri"]
resolver = "2"

[profile.release]
# Fat LTO + a single codegen unit costs link time but is worth it here: the PTY
# read loop and the OSC parser are the hot path of the whole app, and both live
# behind a crate boundary that thin LTO will not inline across.
lto = "fat"
codegen-units = 1
strip = true

# `panic = "abort"` is deliberately NOT set: a panic in one PTY reader thread
# must not take every other session down with it.
